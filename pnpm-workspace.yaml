packages:
  - frontend
  - backend
  - api-schema

# 3パッケージで共有するバージョンはここで集中管理する（就活BOX と同じ作法）
catalog:
  '@types/node': ^22
  typescript: ^5.9.3
  vitest: ^5.0.1
  zod: ^4.4.3

# pnpm 10 は postinstall をデフォルトでブロックする。
# ネイティブバイナリを取得するものはここに挙げないと動かない。
onlyBuiltDependencies:
  - '@biomejs/biome'
  - '@prisma/client'
  - '@prisma/engines'
  - better-sqlite3
  - esbuild
  - prisma

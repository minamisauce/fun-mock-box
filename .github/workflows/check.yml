name: check

permissions: {}

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  check:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          # package.json の packageManager と揃える（lockfile が v9 形式のため）
          version: 10.33.2
          install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      # 落ちた1つで打ち切らず、3つとも結果を出す
      - name: Biome
        run: pnpm run format

      - name: Typecheck
        if: success() || failure()
        run: pnpm run typecheck

      - name: Test
        if: success() || failure()
        run: pnpm run test
